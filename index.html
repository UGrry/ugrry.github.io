<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>海巡研究班25期 · 第二階段考試題庫 自我測驗系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0d1826;
    --navy-900:#14263d;
    --navy-800:#1c344f;
    --navy-700:#264364;
    --paper:#f3ecdc;
    --paper-hi:#faf6ec;
    --paper-dark:#e6dabf;
    --ink:#2a2116;
    --ink-soft:#5c5340;
    --ink-faint:#8a806a;
    --seal:#a5382a;
    --seal-dark:#7e2a20;
    --brass:#b98a3f;
    --brass-hi:#d9ad63;
    --teal:#3d6b66;
    --line: rgba(42,33,22,0.14);
    --shadow: 0 18px 40px rgba(13,24,38,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a3050 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #16283f 0%, transparent 55%),
      var(--navy-950);
    color:var(--paper);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--brass); color:var(--navy-950);}

  .shell{max-width:1180px; margin:0 auto; padding:20px 20px 64px;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    padding:22px 26px; margin-bottom:18px;
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(217,173,99,0.25);
    border-radius:6px; position:relative; overflow:hidden;
  }
  header.top::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 42px);
    pointer-events:none;
  }
  .title-block{position:relative; z-index:1;}
  .eyebrow{font-size:11.5px; letter-spacing:.28em; color:var(--brass-hi); text-transform:uppercase; margin-bottom:6px; font-weight:600;}
  h1{
    font-family:"Noto Serif TC",serif; font-weight:900; font-size:clamp(22px,3.4vw,32px);
    margin:0 0 6px; letter-spacing:.02em; color:var(--paper-hi);
  }
  .subtitle{color:#9fb0c4; font-size:13.5px;}
  .top-stats{position:relative; z-index:1; display:flex; gap:22px; text-align:right;}
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .num{font-family:"Noto Serif TC",serif; font-weight:700; font-size:22px; color:var(--brass-hi);}
  .stat .lbl{font-size:11px; color:#9fb0c4; letter-spacing:.06em;}

  .mode-switch{
    display:inline-flex; background:var(--navy-900);
    border:1px solid rgba(217,173,99,0.3); border-radius:999px; padding:4px; margin-bottom:18px;
  }
  .mode-switch button{
    border:none; background:transparent; color:#a9b8ca;
    font-family:"Noto Sans TC",sans-serif; font-weight:600; font-size:13.5px;
    padding:9px 20px; border-radius:999px; cursor:pointer; transition:.18s ease;
  }
  .mode-switch button.active{background:linear-gradient(180deg,var(--brass-hi),var(--brass)); color:var(--navy-950);}

  .layout{display:grid; grid-template-columns:238px 1fr; gap:18px; align-items:start;}
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} }

  .sidebar{
    background:var(--navy-900); border:1px solid rgba(217,173,99,0.18);
    border-radius:6px; padding:16px 14px 18px; position:sticky; top:16px;
  }
  @media (max-width:860px){ .sidebar{position:static;} }
  .side-h{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass-hi); margin:2px 2px 10px; font-weight:700;}
  .folder-list{list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:6px;}
  .folder-tab{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--navy-800); border:1px solid transparent; border-left:3px solid transparent;
    border-radius:2px; padding:8px 10px; font-size:12.8px; cursor:pointer; color:#c7d3e0; line-height:1.35; transition:.15s ease;
  }
  .folder-tab:hover{background:var(--navy-700);}
  .folder-tab.active{border-left-color:var(--brass-hi); background:var(--navy-700); color:var(--paper-hi);}
  .folder-tab .cnt{font-size:11px; color:#8ea0b6; flex:none;}

  .chip-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;}
  .chip{
    border:1px solid rgba(217,173,99,0.35); background:transparent; color:#c7d3e0;
    border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
  }
  .chip.active{background:var(--brass-hi); border-color:var(--brass-hi); color:var(--navy-950); font-weight:700;}

  .search-wrap{margin-top:14px;}
  .search-wrap input{
    width:100%; background:var(--navy-950); border:1px solid rgba(217,173,99,0.25);
    color:var(--paper-hi); padding:9px 11px; border-radius:4px; font-size:13px; font-family:"Noto Sans TC",sans-serif;
  }
  .search-wrap input::placeholder{color:#71839a;}

  .panel{min-height:420px;}
  .empty{
    background:var(--navy-900); border:1px dashed rgba(217,173,99,0.3); border-radius:6px;
    padding:60px 24px; text-align:center; color:#9fb0c4; font-size:14px;
  }

  .picker-toolbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; color:#c7d3e0;}
  .picker-count{font-size:13px;}
  .picker-count strong{color:var(--brass-hi); font-size:15.5px;}
  .picker-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .picker-list{display:flex; flex-direction:column; gap:8px;}
  .picker-item{
    display:flex; align-items:flex-start; gap:12px; background:var(--navy-900);
    border:1px solid rgba(217,173,99,0.15); border-radius:5px; padding:12px 14px; cursor:pointer;
  }
  .picker-item:hover{border-color:rgba(217,173,99,0.35);}
  .picker-item.checked{border-color:var(--brass-hi); background:var(--navy-800);}
  .picker-item input[type="checkbox"]{margin-top:3px; width:17px; height:17px; accent-color:var(--brass-hi); flex:none; cursor:pointer;}
  .picker-item-body{display:flex; flex-direction:column; gap:6px; flex:1; min-width:0;}
  .picker-item-q{font-size:13.5px; line-height:1.6; color:#dbe4ee;}
  .picker-footer{position:sticky; bottom:0; margin-top:18px; padding-top:14px; border-top:1px solid rgba(217,173,99,0.2); background:linear-gradient(180deg, transparent, var(--navy-950) 30%);}
  .picker-footer .act-btn.next{width:100%;}
  .picker-footer .act-btn.next:disabled{opacity:.4; cursor:not-allowed;}
  .custom-banner{font-size:12.5px; color:#9fb0c4; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .custom-banner .edit-again-btn{color:var(--brass-hi);}
  .edit-again-btn{border:none; background:transparent; color:var(--teal); font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0; font-family:"Noto Sans TC",sans-serif;}

  .progress-wrap{display:flex; align-items:center; gap:12px; margin-bottom:14px; color:#9fb0c4; font-size:12.5px;}
  .progress-track{flex:1; height:5px; background:var(--navy-800); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--brass),var(--brass-hi)); border-radius:999px; transition:width .25s ease;}

  .card{
    background:linear-gradient(180deg, var(--paper-hi), var(--paper)); color:var(--ink);
    border-radius:5px; box-shadow:var(--shadow); padding:30px 30px 26px; position:relative; border:1px solid rgba(0,0,0,0.06);
  }
  .card::before{content:""; position:absolute; left:0; top:18px; bottom:18px; width:5px; background:var(--navy-800); border-radius:0 3px 3px 0;}
  .card-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .tag{font-size:11px; letter-spacing:.05em; padding:4px 9px; border-radius:2px; font-weight:700;}
  .tag.theme{background:var(--navy-900); color:#cfdcea;}
  .tag.qtype{background:var(--paper-dark); color:var(--ink-soft); border:1px solid var(--line);}
  .tag.marker{background:var(--teal); color:#eaf3f1;}
  .qnum{margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}

  .question-text{
    font-family:"Noto Serif TC",serif; font-weight:700; font-size:clamp(17px,2.1vw,20px);
    line-height:1.75; margin:6px 0 20px; color:var(--ink);
  }

  .reveal-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--navy-900); color:var(--paper-hi);
    border:none; padding:11px 20px; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
  }
  .reveal-btn:hover{background:var(--navy-800);}

  .write-hint{font-size:11.5px; color:var(--ink-faint); margin:8px 0 16px;}
  .diff-legend{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); margin:2px 0 4px;}
  .diff-legend mark.diff-bad{padding:0 5px;}
  mark.diff-bad{background:rgba(165,56,42,0.10); color:var(--seal); font-weight:800; border-radius:2px; padding:0 1px;}

  .write-area{margin-top:4px;}
  .write-area textarea{
    width:100%; min-height:170px; background:var(--paper-hi); border:1px solid var(--line); border-radius:4px;
    padding:14px; font-family:"Noto Sans TC",sans-serif; font-size:14.5px; line-height:1.8; color:var(--ink); resize:vertical;
  }
  .write-area textarea:focus{outline:2px solid var(--brass); outline-offset:1px;}

  .compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
  @media (max-width:700px){ .compare-grid{grid-template-columns:1fr;} }
  .compare-col .answer-label{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .user-answer-text{
    white-space:pre-wrap; line-height:1.85; font-size:14.5px; color:var(--ink);
    background:var(--paper-dark); border-radius:4px; padding:14px; border:1px solid var(--line); min-height:60px;
  }
  .user-answer-text.empty{color:var(--ink-faint); font-style:italic;}

  .answer-block{margin-top:20px; padding-top:18px; border-top:1px dashed var(--line);}
  .answer-label{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--teal); font-weight:700; margin-bottom:10px;}
  .answer-list{list-style:none; margin:0; padding:0;}
  .answer-list li{position:relative; padding-left:20px; margin-bottom:8px; line-height:1.85; font-size:14.5px; color:var(--ink);}
  .answer-list li::before{content:"•"; position:absolute; left:2px; top:0; color:var(--brass); font-weight:700;}
  .answer-list li[data-lv="2"]{padding-left:38px; font-size:14px; color:var(--ink-soft);}
  .answer-list li[data-lv="2"]::before{content:"–"; left:20px; color:var(--teal);}
  .answer-list li[data-lv="3"]{padding-left:56px; font-size:13.5px; color:var(--ink-faint);}
  .answer-list li[data-lv="3"]::before{content:"·"; left:40px;}
  .answer-list li[data-lv="0"]{padding-left:0;}
  .answer-list li[data-lv="0"]::before{content:"";}

  .action-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px;}
  .act-btn{
    flex:1 1 auto; min-width:120px; border:1px solid var(--line); background:var(--paper-hi); color:var(--ink);
    padding:10px 14px; border-radius:4px; font-size:13.5px; font-weight:600; cursor:pointer;
    font-family:"Noto Sans TC",sans-serif; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .act-btn.next{background:var(--navy-900); color:var(--paper-hi); border:none; flex:1 1 100%;}
  .act-btn.next:hover{background:var(--navy-800);}

  .browse-item{
    background:linear-gradient(180deg, var(--paper-hi), var(--paper)); color:var(--ink);
    border-radius:5px; padding:16px 20px; margin-bottom:12px; cursor:pointer;
    border:1px solid rgba(0,0,0,0.06); box-shadow:0 6px 16px rgba(13,24,38,0.18);
  }
  .browse-item .card-meta{margin-bottom:10px;}
  .browse-item .question-text{font-size:15.5px; margin:0; line-height:1.6;}
  .browse-item .answer-block{display:none;}
  .browse-item.open .answer-block{display:block;}
  .browse-hint{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}

  footer{text-align:center; color:#5c6f85; font-size:11.5px; margin-top:30px; letter-spacing:.04em;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="title-block">
      <div class="eyebrow">自我測驗系統 · 第二階段</div>
      <h1>海巡研究班25期考試題庫</h1>
      <div class="subtitle">問答題與申論題自我複習工具</div>
    </div>
    <div class="top-stats">
      <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl">總題數</span></div>
    </div>
  </header>

  <div class="mode-switch">
    <button id="btnQuizMode" class="active">測驗模式</button>
    <button id="btnBrowseMode">瀏覽模式</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-h">出題方式</div>
      <div class="chip-row" id="orderModeChips"></div>

      <div class="side-h">主題篩選</div>
      <ul class="folder-list" id="themeList"></ul>

      <div class="side-h">題型</div>
      <div class="chip-row" id="qtypeChips"></div>

      <div class="search-wrap" id="searchWrap" style="display:none;">
        <input type="text" id="searchInput" placeholder="搜尋題目或答案內容…">
      </div>
    </aside>

    <main class="panel" id="panel"></main>
  </div>

  <footer>本工具由題庫資料自動整理產生，內容請以原始題庫為準。</footer>
</div>

<script>
const QUIZ_DATA = [{"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "問答題", "marker": null, "question": "勤務督導區分日、夜間督導，其督導重點各為何？", "answer": [{"level": 2, "text": "日間：內部管理、械彈管制、常年訓練、執勤紀律及安全。"}, {"level": 2, "text": "夜間：勤務規劃與執行、執勤紀律及營區安全維護。"}], "id": "0"}, {"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "問答題", "marker": null, "question": "同時有兩個以上之狀況時，指揮調度勤務人員或機動人力，應先考量案（事）件性質，發生時間、位置等因素及勤務現況與機動人員控制運用情形，實施彈性指揮，試述指揮調度優先順序。", "answer": [{"level": 1, "text": "最緊急者先處置、最嚴重者先處置、最快速者先調派。"}], "id": "1"}, {"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "問答題", "marker": null, "question": "本署執行巡邏勤務時，巡邏汽車開啟警示燈不開警鳴器時機為何？", "answer": [{"level": 2, "text": "執行道路檢查。"}, {"level": 2, "text": "執行專案勤務巡邏任務。"}, {"level": 2, "text": "執行其他公務事件。"}], "id": "2"}, {"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "問答題", "marker": null, "question": "安檢所人員發現港口污染事件時，處理要點為何？", "answer": [{"level": 2, "text": "確認污染源。"}, {"level": 2, "text": "蒐證、取締、函送。"}, {"level": 2, "text": "三線回報。"}, {"level": 2, "text": "通報相關單位協處。"}], "id": "3"}, {"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "問答題", "marker": null, "question": "大陸船舶未經許可進入臺灣地區禁止水域，應如何處置?", "answer": [{"level": 2, "text": "進入者，強制驅離。"}, {"level": 2, "text": "可疑者，令其停船受檢。"}, {"level": 2, "text": "驅離無效，扣留船舶、留置人員。"}], "id": "4"}, {"theme": "壹、【法律】海巡相關法規專題研究", "qtype": "申論題", "marker": null, "question": "OO年OO月OO日，南田雷達發報於大武東方4浬發現突出可疑目標持續往西南航行，經巡防區指揮部通報線上巡邏組發現於屏東縣塔瓦溪南岸疑似有越南民眾藉橡皮艇偷渡，為能順利緝獲偷渡民眾到案，岸巡隊勤務部署原則為何？", "answer": [{"level": 2, "text": "拘束點：初期派兵至岸際監控，運用地形先期拘束，以利後續緝捕任務。"}, {"level": 2, "text": "緝捕點：目標已被雷達預警通報狀況下，機動兵力到達岸際實施緝捕作為。"}, {"level": 2, "text": "攔截點：因應不法於岸際上岸，在可能逃逸路線開設攔截點。"}, {"level": 2, "text": "管制哨：在重要聯外道路設置管制哨，實施人車管制，避免不法集團接應。"}, {"level": 2, "text": "掃蕩區：藉由上述各項部署作為完成封鎖及隔離，最後再投入優勢兵力掃蕩殘餘不法。"}], "id": "5"}, {"theme": "貳、【法律】海巡查緝走私偷渡專題研究", "qtype": "問答題", "marker": null, "question": "請試舉出3種常見走私管道?", "answer": [{"level": 2, "text": "海上丟包。"}, {"level": 2, "text": "近岸搶灘。"}, {"level": 2, "text": "海上接駁。"}, {"level": 2, "text": "地道輸送。"}, {"level": 2, "text": "漁貨掩護。"}, {"level": 2, "text": "改造漁船。"}], "id": "6"}, {"theme": "貳、【法律】海巡查緝走私偷渡專題研究", "qtype": "問答題", "marker": null, "question": "遇有走私、偷渡等重大案件時，應採取何種通報方式?", "answer": [{"level": 1, "text": "邊處置邊通報。"}], "id": "7"}, {"theme": "貳、【法律】海巡查緝走私偷渡專題研究", "qtype": "問答題", "marker": null, "question": "常見走私槍械方式為何?", "answer": [{"level": 2, "text": "漁船夾帶走私。"}, {"level": 2, "text": "貨櫃夾帶走私。"}, {"level": 2, "text": "散裝夾帶走私。"}, {"level": 2, "text": "空運夾帶走私。"}, {"level": 2, "text": "人員夾帶走私。"}], "id": "8"}, {"theme": "貳、【法律】海巡查緝走私偷渡專題研究", "qtype": "申論題", "marker": null, "question": "台灣為海島地形，海岸線綿長，防杜走私不易，由於社會型態改變，舉凡槍械、彈藥、毒品、菸品、鳥禽、動（植）物等均為走私的標的物。不法分子為貪圖暴利，以各種手段，從海上、空中私運國內，不僅直接影響國家稅收，破壞經濟政策，間接也影響了工商發展及民眾生活、社會風氣與國家形象。貴官從事海岸巡防工作多年，深知惟有瞭解並鑽研走私的時機與模式，方能掌握機先，制敵勝敵，請依個人所學及工作經驗回答下列問題？ 走私之時機為何？ 走私模式為何？ 請以1項走私模式說明其內涵為何？", "answer": [{"level": 2, "text": "走私時機如下："}, {"level": 1, "text": "三大節慶市場需求增加。"}, {"level": 1, "text": "聚眾活動或重大事件發生。"}, {"level": 1, "text": "惡劣天候或夜色昏暗。"}, {"level": 1, "text": "海象平穩或漲潮時機。"}, {"level": 1, "text": "地形地物改變或沿海工程興建。"}, {"level": 2, "text": "走私模式如下："}, {"level": 1, "text": "海上接駁裝卸私貨。"}, {"level": 1, "text": "海上丟包。"}, {"level": 1, "text": "以魚貨掩護規避檢查。"}, {"level": 1, "text": "改造漁船裝設密窩，藏匿私貨。"}, {"level": 1, "text": "海上工作船舶走私。"}, {"level": 2, "text": "個人試舉1項走私模式內涵說明如下：(僅舉1例即可)"}, {"level": 1, "text": "海上接駁裝卸私貨："}, {"level": 1, "text": "利用商貨輪或大型漁船（俗稱母桶）將私貨載運至公海上指定地點等候，由我國籍漁船、舢舨以約定之聲光信號或通聯頻道等方式識別後，接駁私貨運回國內。"}, {"level": 1, "text": "海上丟包："}, {"level": 1, "text": "利用商（漁）船將私貨運至領海內指定地點，將私貨繫上大型浮球、浮標或GPS後拋入海中，再派漁船出海打撈偷運上岸。"}, {"level": 1, "text": "以魚貨掩護規避檢查："}, {"level": 1, "text": "將私貨放置於船艙底層，上面覆蓋大批魚貨及碎冰掩飾，進入漁港後，再以卸魚貨為名，行搬卸私貨之實。"}, {"level": 1, "text": "改造漁船裝設密窩，藏匿私貨："}, {"level": 1, "text": "不法船隻為逃避安檢人員查緝，以變造密窩（艙）之方式，將私貨藏放其中，並將開口封閉，進港後再伺機取出。"}, {"level": 1, "text": "海上工作船舶走私："}, {"level": 1, "text": "利用海上工作船或工作平台底層空艙藏運私貨，並以進行海岸工程之名，行走私之實。"}], "id": "9"}, {"theme": "貳、【法律】海巡查緝走私偷渡專題研究", "qtype": "申論題", "marker": null, "question": "海巡署查獲兩艘我國籍甲、乙漁船受託載送在菲律賓設廠生產的「白牌香菸」(在台灣有註冊的香菸)回國。甲船在距基線20浬處，乙船在距基線11浬處，均載有100箱香菸，欲走私返國。試問兩船的處罰依據及應如何處置?", "answer": [{"level": 2, "text": "甲船，違反《菸酒管理法》運輸非屬自用私菸，處新臺幣3萬元以上50萬元以下罰鍰。「白牌香菸」數量超出法定數量，故以私菸論。"}, {"level": 2, "text": "乙船，違反《菸酒管理法》輸入香菸罪，處3年以下有期徒刑，得併科新臺幣20萬元以上1000萬元以下罰金。因為該船已越過領海外界線，屬於從境外進入境內，故應處以該法。"}], "id": "10"}, {"theme": "參、【法律】海洋汙染法規專題研討", "qtype": "問答題", "marker": null, "question": "為處理重大海洋污染緊急事件，中央主管機關應擬定什麼應變計畫？", "answer": [{"level": 1, "text": "重大海洋污染緊急應變計畫。"}], "id": "11"}, {"theme": "參、【法律】海洋汙染法規專題研討", "qtype": "問答題", "marker": null, "question": "海洋污染緊急應變納入災害防救法哪四大精神？", "answer": [{"level": 1, "text": "預防、整備、應變、復原。"}], "id": "12"}, {"theme": "參、【法律】海洋汙染法規專題研討", "qtype": "問答題", "marker": null, "question": "重大海洋污染緊急應變計畫將海洋污染分為哪些級別？", "answer": [{"level": 1, "text": "油及海上化學品均分為三級。"}], "id": "13"}, {"theme": "參、【法律】海洋汙染法規專題研討", "qtype": "問答題", "marker": null, "question": "為緊急處理海洋廢棄物，及簡化海廢通報與清理流程，海保署成立什麼平台？", "answer": [{"level": 1, "text": "海洋廢棄物清除網。"}], "id": "14"}, {"theme": "參、【法律】海洋汙染法規專題研討", "qtype": "申論題", "marker": null, "question": "舉例說明5項臺灣海洋廢棄物治理的內容及其主要的參與機關。", "answer": [{"level": 1, "text": "清理："}, {"level": 1, "text": "內政部負責國家公園、交通部負責商港及風景區、漁業署負責漁港、國防部負責軍港、海委會負責海域。"}, {"level": 0, "text": "減量："}, {"level": 1, "text": "林保署負責漂流木、漁業署負責漁具標示、環境部負責塑膠減量及河川垃圾攔除。"}, {"level": 0, "text": "去化："}, {"level": 1, "text": "海保署協調漁港廢棄物處理，經濟部及環境部協助廢漁網具回收。"}, {"level": 0, "text": "透明："}, {"level": 1, "text": "環境部建立海岸環境清理資訊平台，公開清理成果。"}, {"level": 0, "text": "教育："}, {"level": 1, "text": "教育部推動學校海洋環境教育，各部會推動社會教育。"}], "id": "15"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "問答題", "marker": null, "question": "依據《兩岸人民關係條例》第32條第2項規定，認定大陸船舶違法情節重大，欲沒入該船舶。請問當船長並非船舶所有人時，是否仍得沒入該船舶？", "answer": [{"level": 1, "text": "依《行政罰法》規定，當船長並非船舶所有人，不可沒入；但如果船舶所有人有故意或重大過失時，仍得沒入船舶。"}], "id": "16"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "問答題", "marker": null, "question": "兩岸人民關係例是規範兩岸人民往來之相關問題，與行政程序法保障人民參與政府決策中的「陳述意見」之關係。請分析其原則與例外？", "answer": [{"level": 1, "text": "依《行政程序法》規定，行政處分前原則上應給予陳述意見機會，但涉及國家安全等法定情形者，得免予陳述。"}, {"level": 1, "text": "依《兩岸人民關係條例》規定，大陸人民強制出境前，原則上應給予陳述意見機會。"}], "id": "17"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "問答題", "marker": null, "question": "依據《兩岸人民關係條例》第32條規定，中國大陸船舶非經主管機關許可不得進入管制海域。如應受「刑罰」與「行政罰」規定，適法之順序如何？", "answer": [{"level": 1, "text": "依行政罰法第26條規定，一行為同時觸犯刑事法律及行政法義務者，優先依刑事法律處罰。"}, {"level": 1, "text": "但其他種類行政罰或未經法院宣告沒收之物，仍得依法裁處。"}, {"level": 1, "text": "經不起訴、緩起訴確定或無罪、免訴、免刑、緩刑等裁判確定者，得依法裁處行政罰。"}], "id": "18"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "問答題", "marker": null, "question": "如有中國大陸漁船在金門海域距岸1000公尺處水域越區捕魚。請問實務上依據民國104年金門地檢署舉行之座談會結論，在處理同時違反入出國罪之論處之情形。", "answer": [{"level": 1, "text": "依上述座談會結論，大陸漁船越區捕魚，應嚴格認定有無非法入境故意，不得僅憑進入管制水域即認定犯罪。若屬誤闖或偶然經過而無犯意者，由行政機關依法處理。"}], "id": "19"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "問答題", "marker": null, "question": "依據《兩岸人民關係條例》第32條第2項規定，大陸船舶未經許可進入禁止、限制水域，如有違法情節重大時，得沒入船舶。請問如何裁定沒入該違法之大陸船舶？", "answer": [{"level": 1, "text": "應沒入：搶劫、走私、非法漁業、載人非法出入境或對執法船艦有敵對行為。"}, {"level": 1, "text": "得沒入：隱蔽船名、無船名、拒檢、從事漁撈、其他違法行為，或曾遭扣留二次以上者。"}], "id": "20"}, {"theme": "肆、【法律】兩岸事務專題研討", "qtype": "申論題", "marker": null, "question": "依據《刑事訴訟法》規定，原則應在24小時內移由法院決定覊押與否，但依據《兩岸人民關係條例》第32條規定，對於扣留船舶與留置人員有三個月的調查時間。試分析此三個月調查時間的限制人身自由，此規定之合憲性。", "answer": [{"level": 1, "text": "合憲：依《憲法增修條文》第11條，兩岸人民權利義務得以法律特別規定，基於國家安全及海域管理需要，得依法留置調查。"}, {"level": 1, "text": "違憲：依《憲法》第8條及《公民與政治權利國際公約》第9條，人身自由應受保障，長期留置恐違反正當法律程序及比例原則。"}, {"level": 1, "text": "結論：基於國家安全雖得採取特別措施，但仍須符合比例原則、正當程序及司法救濟保障，不能僅因兩岸敵對狀態即認定三個月留置當然合憲。"}], "id": "21"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "依「行政院國家搜救指揮中心作業手冊」，我國搜救責任區為何？", "answer": [{"level": 1, "text": "臺北飛航情報區。"}], "id": "22"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "依「災害防救法」第3條規定，震災和水災之中央災害防救業務主管機關分別是哪個部會？", "answer": [{"level": 1, "text": "震災：內政部。"}, {"level": 1, "text": "水災：經濟部。"}], "id": "23"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "依「災害防救法施行細則規定」第2條規定及「海岸巡防機關執行海上救難作業程序」，海難定義為何？", "answer": [{"level": 1, "text": "船舶發生故障、沉沒、擱淺、碰撞、失火、爆炸或其他有關船舶、貨載、船員或旅客之非常事故。"}], "id": "24"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "依國際海事組織(IMO)及國際飛航組織(ICAO)分工各國搜救責任區，責任區內均應設置搜救協調中心，請問我國搜救協調中心(RCC)為哪個機關?", "answer": [{"level": 1, "text": "行政院國家搜救指揮中心。"}], "id": "25"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "中央氣象署發布東部及北部地區海上陸上颱風警報，中央成立風災應變中心，本署執行新北龍洞岸際勸離勤務，係依何機關公告劃設警戒區域執行之?", "answer": [{"level": 1, "text": "新北市政府。"}], "id": "26"}, {"theme": "伍、【法律】災害防救法規", "qtype": "問答題", "marker": null, "question": "「凱米」颱風期間南部地區發生9起海難事件，其中8艘貨輪擱淺於高雄、屏東岸際，請問若船舶所有人未依限期採取必要應變措施，主管機關交通部航港局可依何項法規，逕行採取必要措施，以防止海洋污染等二次災害發生。", "answer": [{"level": 1, "text": "商港法第53條。"}], "id": "27"}, {"theme": "伍、【法律】災害防救法規", "qtype": "申論題", "marker": null, "question": "高雄旗津沙灘發生民眾水上遊憩溺水事件，本署及消防隊均接獲通報趕赴現場救援，試問海巡與消防單位針對岸際救生案件如何分工？", "answer": [{"level": 1, "text": "共同救援：依政府一體原則，海巡及消防接獲落水通報，均應立即派員攜帶裝備趕赴現場。"}, {"level": 1, "text": "初期指揮：由先抵達現場人員擔任初期指揮官，統籌救援工作。"}, {"level": 1, "text": "協調分工：雙方人員到場後，應協調最佳救援方式，共同執行搜救，提升救援效能。"}], "id": "28"}, {"theme": "伍、【法律】災害防救法規", "qtype": "申論題", "marker": null, "question": "發生船舶或航空災難事故，請問搜救能量派遣原則為何?", "answer": [{"level": 1, "text": "依行政院國家搜救指揮中心作業手冊第三章第二節，搜救派遣原則如下："}, {"level": 1, "text": "人命優先：優先派遣最快速、有效之資源救援。"}, {"level": 1, "text": "快速就近：依事故地點及時間，派遣鄰近搜救單位。"}, {"level": 1, "text": "輕重緩急：優先處理危害較嚴重之事故。"}, {"level": 1, "text": "資源確保：派遣足夠搜救能量，並保留備援資源。"}, {"level": 1, "text": "經濟節約：兼顧救援成效及資源有效運用。"}, {"level": 1, "text": "資源運用：陸上以消防、警政為優先；海上以海巡為優先，特殊情況得彈性調派其他單位。"}], "id": "29"}, {"theme": "壹、【專業】近期重大案例研究", "qtype": "問答題", "marker": null, "question": "依洗錢防制法第2條，洗錢除「隱匿特定犯罪所得或掩飾其來源及妨礙或危害國家對於特定犯罪所得之調查、發現、保全、沒收或追徵」外，還有何種行為?(來源:海巡署「常見違法案例及相關法規」宣導教材--海巡人員幫助洗錢)(中)", "answer": [{"level": 1, "text": "收受、持有或使用他人之特定犯罪所得。"}, {"level": 1, "text": "使用自己之特定犯罪所得與他人進行交易。"}], "id": "30"}, {"theme": "壹、【專業】近期重大案例研究", "qtype": "問答題", "marker": null, "question": "目標監控應處原則為何? (來源:本中心「岸海聯合勤務教則」)(易)", "answer": [{"level": 1, "text": "依「偵知」、「辨識」、「掌握」、「採取措施」等執行程序，達到預警功效。"}], "id": "31"}, {"theme": "壹、【專業】近期重大案例研究", "qtype": "問答題", "marker": null, "question": "請問「預置兵力」的定義? (來源:本中心「岸海聯合勤務教則」)(中)", "answer": [{"level": 1, "text": "通報鄰近單位應處。"}, {"level": 1, "text": "完成機動支援之勤務人力、裝備整備，並預置於狀況可能發生地點。"}], "id": "32"}, {"theme": "壹、【專業】近期重大案例研究", "qtype": "問答題", "marker": null, "question": "請問海巡「勤務攔截部署」的概念? (來源:本中心「岸海聯合勤務教則」)(易)", "answer": [{"level": 1, "text": "兵力由內往外建立攔截網，拘束在特定地點，形成包圍態勢，進行掃蕩。"}], "id": "33"}, {"theme": "壹、【專業】近期重大案例研究", "qtype": "申論題", "marker": null, "question": "試申論漁船（筏）逃避或拒絕安檢之處置。 (中)", "answer": [{"level": 1, "text": "法令依據：依《國家安全法》、《海岸巡防法》及《行政罰法》等規定，對逃避或拒絕安檢之漁船（筏）依法處置。"}, {"level": 1, "text": "發動檢查：以手勢、警示燈、旗幟或哨音等方式，要求船筏停船受檢，並全程錄音、錄影蒐證。"}, {"level": 1, "text": "拒檢處置："}, {"level": 1, "text": "持續要求停船受檢，並通報支援。"}, {"level": 1, "text": "出港拒檢：通報雷達鎖定及海巡艇查緝。"}, {"level": 1, "text": "進港拒檢：通報港巡、監卸人員或機動兵力支援，並登錄安檢資訊系統及回報岸巡隊。"}, {"level": 1, "text": "查獲後如無正當理由拒檢，依《行政罰法》刑事優先原則處理。"}], "id": "34"}, {"theme": "貳、【專業】岸際攔截部署計畫原則", "qtype": "問答題", "marker": null, "question": "三道監偵幕實務運作依距離區分為遠程、中程、近岸、岸際及監控，試就各範圍說明之監控運用方式？", "answer": [{"level": 1, "text": "遠程：海勤系統監控。"}, {"level": 1, "text": "中程：岸際與海巡艇雷達監控。"}, {"level": 1, "text": "近岸：雷達、守望、海巡艇及巡邏監控。"}, {"level": 1, "text": "岸際：巡邏及守望共同監控雷達盲區及守望死角。"}], "id": "35"}, {"theme": "貳、【專業】岸際攔截部署計畫原則", "qtype": "問答題", "marker": null, "question": "目標監控應處原則為何?", "answer": [{"level": 1, "text": "依「偵知」、「辨識」、「掌握」、「採取措施」等執行程序，達到預警功效。"}], "id": "36"}, {"theme": "貳、【專業】岸際攔截部署計畫原則", "qtype": "問答題", "marker": null, "question": "岸際攔截部署計畫的主要目的是什麼？", "answer": [{"level": 1, "text": "防止非法入出國、走私及海上犯罪。"}], "id": "37"}, {"theme": "貳、【專業】岸際攔截部署計畫原則", "qtype": "問答題", "marker": null, "question": "試述「岸際攔截部署」與「海上巡邏勤務」在任務性質與執行重點上的差異。", "answer": [{"level": 1, "text": "岸際攔截部署：強調情資研析、攔截線設置與應變。"}, {"level": 1, "text": "海上巡邏勤務：強調廣域巡航、維持海上秩序與應變。"}], "id": "38"}, {"theme": "貳、【專業】岸際攔截部署計畫原則", "qtype": "問答題", "marker": null, "question": "若接獲情資顯示有不法船舶將於特定岸段登陸，請說明應如何啟動攔截部署及執行流程。", "answer": [{"level": 1, "text": "啟動通報與指揮機制，部署岸際攔截與監偵單位。"}, {"level": 1, "text": "運用科技裝備掌握動態，確保成功攔截。"}], "id": "39"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "問答題", "marker": null, "question": "海洋委員會海巡署岸、海聯合勤務巡防區指揮部勤指中心實施計畫，對於成立巡防區的規劃構想原則為何? (請簡述之)", "answer": [{"level": 1, "text": "早期預警。"}, {"level": 1, "text": "嚴密掌握。"}, {"level": 1, "text": "迅速反應。"}, {"level": 1, "text": "周延處理。"}, {"level": 1, "text": "創新靈活。"}], "id": "40"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "問答題", "marker": null, "question": "海洋委員會海巡署岸、海聯合勤務巡防區指揮部勤指中心實施計畫，巡防區對 目標監偵處置程序為何? (請簡述之)", "answer": [{"level": 1, "text": "應就「偵知」、「辨識」、「掌握」、「採取措施」執行程序，確實完成目標偵獲與研判，爭取反應縱深，達到提早預警之功效"}], "id": "41"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "問答題", "marker": null, "question": "海洋委員會海巡署岸、海聯合勤務巡防區指揮部勤指中心實施計畫，就巡防區運作，就『指管長、管制官、通信員』及『雷達操作員』排班執勤方式為何? (請簡述之)", "answer": [{"level": 1, "text": "指管長、管制官、通信員：採2班，每班12 小時輪值。"}, {"level": 1, "text": "雷達操作員：採3班， 24小時輪值。"}], "id": "42"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "問答題", "marker": null, "question": "海洋委員會海巡署岸、海聯合勤務巡防區指揮部勤指中心實施計畫，巡防區勤務整合管制與運用內，其中就『線上巡邏勤務』、『巡防區及勤務派遣單位』、『雷達操作員應與守望哨』、『偵防查緝隊、特勤隊及空勤吊掛分隊』應多久實施通聯驗證? (請簡述之)", "answer": [{"level": 1, "text": "線上巡邏勤務：於抵達、離開目標地點、收勤及勤務調整時，實施通聯並記錄備查。"}, {"level": 1, "text": "巡防區、勤務派遣單位：每半小時與線上巡邏勤務，實施通聯並記錄備查。"}, {"level": 1, "text": "雷操手、守望哨：每半小時，實施通聯並記錄備查。"}, {"level": 1, "text": "查緝隊、特勤隊及空勤隊：執行任務前後，實施通聯並記錄備查。"}], "id": "43"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "申論題", "marker": null, "question": "據報載115年7月24日2名中國籍男子(欒男、于男、新疆、安徽)搭乘橡皮艇自新北八里台北港岸際登陸臺灣，最終於7月30日在桃園市朝楊森林公園遭海巡與警方查獲、依違反《入出國及移民法》申押禁見。嗣後、海洋委員會海巡署對於查處海域、岸際無人船艇案件指導事項為何?(計六項請簡述之)", "answer": [{"level": 1, "text": "現場跡證保全："}, {"level": 1, "text": "落實現場跡證保全，不得任意登艇或觸摸物品，搬運時應配戴手套。"}, {"level": 1, "text": "成立專案小組："}, {"level": 1, "text": "成立專案小組，納入查緝隊及偵防分署，共同調查。"}, {"level": 1, "text": "情資蒐集與通報："}, {"level": 1, "text": "巡防區提供雷達航跡、報案資料及錄音檔，並通知查緝隊查證及聯繫報案人。"}, {"level": 1, "text": "情資整合與共享："}, {"level": 1, "text": "各分署應主動提供監視影像、訪查及相關資料，由偵防分署交叉比對，避免重複調查。"}, {"level": 1, "text": "重大案件統一回報："}, {"level": 1, "text": "涉及國家安全或重大偷渡案件，由偵防分署統一向上回報溯源查處進度，確保資訊一致。"}, {"level": 1, "text": "強化教育訓練："}, {"level": 1, "text": "加強偵查不公開、證據保全及蒐證教育訓練，提升案件偵辦品質。"}], "id": "44"}, {"theme": "參、【專業】巡防區勤務統合專題研討", "qtype": "申論題", "marker": null, "question": "據媒體報導2024年2月14日『0214金 門事件』，中國大陸『三無』快艇越界進入金門禁限制水域捕撈、為躲避海巡署查緝，追逐中意外翻覆，船上4人落海，其中2人不幸溺斃。歷經5個多月16輪談判，2024年7月30日在金門簽署共識書。請問: 中國大陸『三無』快艇的三無係指稱何種類型快艇? 有關臺灣澎湖、金門、馬祖禁限水域範圍劃設範圍原則為何? 目前海巡隊對於越界大陸漁船處置作為，除增派大型艦船應處外，另採取哪六大處置手段，以有效應處?", "answer": [{"level": 1, "text": "「三無」快艇： 指無船名、無船證、無船籍之船舶。"}, {"level": 1, "text": "禁限制水域範圍： 臺灣、澎湖及東沙地區，禁止水域為領海基線起12浬，限制水域為24浬；金門、馬祖原則以4,000公尺及6,000公尺劃設。"}, {"level": 1, "text": "六大處置手段： 驅離、扣留、留置、沒入漁貨（具）、罰鍰及沒入船舶。"}], "id": "45"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "問答題", "marker": null, "question": "何謂犯罪偵查基本原則中的「法律保留原則」與「法律優位原則」？", "answer": [{"level": 1, "text": "法律保留原則：針對人民基本人權的干預，須由法律加以規範。"}, {"level": 1, "text": "法律優位原則：行政行為不得牴觸法律，下位階不得牴觸上位階法律。"}], "id": "46"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "問答題", "marker": null, "question": "依刑事訴訟法第128條規定，由法官簽名的搜索票上應明確記載哪些事項？", "answer": [{"level": 0, "text": "搜索票應記載下列事項："}, {"level": 1, "text": "案由。"}, {"level": 1, "text": "搜索票聲請人。"}, {"level": 1, "text": "有效期間：逾期不得執行搜索。"}, {"level": 1, "text": "被搜索人基本資料。"}, {"level": 1, "text": "應扣押物。"}, {"level": 1, "text": "搜索範圍：處所、身體、物件或電磁紀錄。"}, {"level": 1, "text": "注意事項：法官指示事項。"}], "id": "47"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "問答題", "marker": null, "question": "何謂無令狀搜索中的「附帶搜索」？其搜索範圍有何限制？", "answer": [{"level": 1, "text": "為確保執法人員、被告人身安全及防止證據湮滅之無令狀搜索。"}, {"level": 1, "text": "以被告或犯罪嫌疑人之身體、隨身物件、所使用交通工具及其立即可觸及之處所為限。"}], "id": "48"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "問答題", "marker": null, "question": "什麼是「無令狀搜索」？哪三種為常見的類型？", "answer": [{"level": 1, "text": "為確保執法人員、被告人身安全及防止證據湮滅之緊急情況或經被搜索人同意，執法人員不需持有搜索票，可直接搜索。"}, {"level": 1, "text": "附帶搜索、逕行搜索、同意搜索。"}], "id": "49"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "問答題", "marker": null, "question": "執行夜間搜索、扣押原則上有何限制？例外情形為何？", "answer": [{"level": 1, "text": "有人居住或看守之住宅或其他處所，原則不得於日出前、日沒後進入搜索、扣押。"}, {"level": 1, "text": "如有刑訴法146、147條之情形，得依法執行搜索須載明筆錄。"}], "id": "50"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "申論題", "marker": null, "question": "試說明犯罪偵查應遵守之「法律優位、法律保留、比例、令狀及法官保留原則」，並論述其重要性。", "answer": [{"level": 1, "text": "法律優位：偵查行為不得牴觸法律。"}, {"level": 1, "text": "法律保留：限制人民權利須有法律依據。"}, {"level": 1, "text": "比例原則：採取適當、必要且侵害最小之手段。"}, {"level": 1, "text": "令狀原則：強制處分原則上須依法取得令狀。"}, {"level": 1, "text": "法官保留：重大強制處分原則上須經法官許可。"}, {"level": 1, "text": "上述五點重要性：確保偵查合法，避免濫權及違法取證，兼顧犯罪追訴與人權保障。"}], "id": "51"}, {"theme": "肆、【專業】犯罪偵查實務研討考題", "qtype": "申論題", "marker": null, "question": "試說明附帶搜索、逕行搜索及同意搜索之要件與注意事項。", "answer": [{"level": 1, "text": "附帶搜索：合法逮捕、拘提或羈押時，得搜索犯罪嫌疑人身體、隨身物品、交通工具及立即可觸及範圍。"}, {"level": 1, "text": "逕行搜索：犯罪正在進行或證據可能遭湮滅等急迫情形，得依法無票搜索。"}, {"level": 1, "text": "同意搜索：須由受搜索人出於自願同意，執行人員應出示證件並記載於筆錄。"}, {"level": 1, "text": "執行時均應注意法定要件及搜索範圍，不得任意擴張。"}], "id": "52"}, {"theme": "伍、【專業】三道監偵幕勤務整合作為", "qtype": "問答題", "marker": null, "question": "三道監偵幕勤務整合的核心目的為何？", "answer": [{"level": 1, "text": "整合雷達、無人機及岸海巡邏兵力等，建立「偵知、識別、追蹤、研判、決策、派遣、應處、蒐證、回饋」的完整閉環，避免目標失去掌握。"}], "id": "53"}, {"theme": "伍、【專業】三道監偵幕勤務整合作為", "qtype": "問答題", "marker": null, "question": "雷達發現微弱、忽隱忽現且未顯示AIS資訊的海上目標時，值勤人員應採取哪些基本作為？", "answer": [{"level": 1, "text": "持續追蹤可疑目標航向、航速及位置，同時運用鄰近雷達、光電或紅外線等設備進行複式查證，並視狀況派遣巡防艇、岸際巡邏人員或無人機前往辨識，直到確認其身分或排除威脅為止。"}], "id": "54"}, {"theme": "伍、【專業】三道監偵幕勤務整合作為", "qtype": "問答題", "marker": null, "question": "何謂「多源感測、複式查證」？請列舉四項可運用的監偵手段。", "answer": [{"level": 1, "text": "不依賴單一雷達或值勤人員判斷，而是將不同設備及情資交互比對，以提高小型目標的辨識能力。"}, {"level": 1, "text": "可運用的監偵手段包括："}, {"level": 1, "text": "岸際或艦艇雷達。"}, {"level": 1, "text": "AIS、VMS等船舶動態資料。"}, {"level": 1, "text": "光電或紅外線熱影像系統。"}, {"level": 1, "text": "無人機空中偵巡。"}, {"level": 1, "text": "港區監視器或岸際監控系統。"}, {"level": 1, "text": "巡防艇、巡邏車及現場人員目視查證。"}], "id": "55"}];
const THEMES = ["壹、【法律】海巡相關法規專題研究", "貳、【法律】海巡查緝走私偷渡專題研究", "參、【法律】海洋汙染法規專題研討", "肆、【法律】兩岸事務專題研討", "伍、【法律】災害防救法規", "壹、【專業】近期重大案例研究", "貳、【專業】岸際攔截部署計畫原則", "參、【專業】巡防區勤務統合專題研討", "肆、【專業】犯罪偵查實務研討考題", "伍、【專業】三道監偵幕勤務整合作為"];
const QTYPES_ORDER = ["問答題", "申論題"];

const state = {
  mode: 'quiz',
  orderMode: 'filter',     // 'filter' = 依篩選出題, 'custom' = 自選題目測驗
  customSelected: new Set(),
  customLocked: false,
  themes: new Set(THEMES),
  qtypes: new Set(QTYPES_ORDER),
  search: '',
  order: [],
  pos: 0,
  revealed: false,
};

function shortTheme(t){
  return t.replace(/^[壹貳參肆伍陸柒捌玖拾一二三四五六七八九十]+、/, '');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filteredItems(){
  return QUIZ_DATA.filter(it =>
    state.themes.has(it.theme) &&
    state.qtypes.has(it.qtype) &&
    (!state.search || (it.question + it.answer.map(a=>a.text).join('')).includes(state.search))
  );
}

function renderAnswerList(answer){
  return '<ul class="answer-list">' + answer.map(a =>
    '<li data-lv="'+a.level+'">'+escapeHtml(a.text)+'</li>'
  ).join('') + '</ul>';
}

// ---------- 逐字比對（LCS）：用來標記使用者作答內容與標準答案的差異 ----------
const DIFF_MAX_LEN = 4000;
let diffTimer = null;
let userAnswers = {}; // { [questionId]: 使用者輸入的整段文字 }

function lcsDiff(a, b){
  const n = a.length, m = b.length;
  const dp = new Int16Array((n+1)*(m+1));
  const idx = (i,j) => i*(m+1)+j;
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[idx(i,j)] = a[i]===b[j] ? dp[idx(i+1,j+1)]+1 : Math.max(dp[idx(i+1,j)], dp[idx(i,j+1)]);
    }
  }
  let i=0,j=0;
  const aOps=[], bOps=[];
  while(i<n && j<m){
    if(a[i]===b[j]){ aOps.push({t:'equal',c:a[i]}); bOps.push({t:'equal',c:b[j]}); i++; j++; }
    else if(dp[idx(i+1,j)] >= dp[idx(i,j+1)]){ aOps.push({t:'insert',c:a[i]}); i++; }
    else { bOps.push({t:'delete',c:b[j]}); j++; }
  }
  while(i<n){ aOps.push({t:'insert',c:a[i]}); i++; }
  while(j<m){ bOps.push({t:'delete',c:b[j]}); j++; }
  return {aOps, bOps};
}

function groupOps(ops){
  const out=[];
  for(const op of ops){
    if(out.length && out[out.length-1].t===op.t){ out[out.length-1].text += op.c; }
    else out.push({t:op.t, text:op.c});
  }
  return out;
}

function renderDiffRuns(runs, badType){
  return runs.map(r => r.t===badType ? '<mark class="diff-bad">'+escapeHtml(r.text)+'</mark>' : escapeHtml(r.text)).join('');
}

function stdConcatText(answer){
  return answer.map(a => a.text).join('\n');
}

function renderStdListDiff(answer, userText){
  if(userText.trim()==='' || userText.length > DIFF_MAX_LEN || stdConcatText(answer).length > DIFF_MAX_LEN){
    return answer.map(a => '<li data-lv="'+a.level+'">'+escapeHtml(a.text)+'</li>').join('');
  }
  const std = stdConcatText(answer);
  const {bOps} = lcsDiff(userText, std);
  let ptr = 0;
  return answer.map((a,i) => {
    const len = a.text.length;
    const lineOps = bOps.slice(ptr, ptr+len);
    ptr += len;
    if(i < answer.length-1) ptr += 1; // skip the '\n' separator op
    const runs = groupOps(lineOps);
    return '<li data-lv="'+a.level+'">'+renderDiffRuns(runs,'delete')+'</li>';
  }).join('');
}

function renderUserDiffHtml(answer, userText){
  if(userText.trim()===''){
    return '<div class="user-answer-text empty">（這題你還沒有寫下答案）</div>';
  }
  const std = stdConcatText(answer);
  if(userText.length > DIFF_MAX_LEN || std.length > DIFF_MAX_LEN){
    return '<div class="user-answer-text">'+escapeHtml(userText)+'</div>';
  }
  const {aOps} = lcsDiff(userText, std);
  const runs = groupOps(aOps);
  return '<div class="user-answer-text">'+renderDiffRuns(runs,'insert')+'</div>';
}

function updateQuizDiff(id, it){
  const userText = userAnswers[id] || '';
  const userEl = document.getElementById('userDiffView');
  const stdEl = document.getElementById('stdDiffView');
  if(userEl) userEl.innerHTML = renderUserDiffHtml(it.answer, userText);
  if(stdEl) stdEl.innerHTML = renderStdListDiff(it.answer, userText);
}

function buildSidebar(){
  const orderChips = document.getElementById('orderModeChips');
  orderChips.innerHTML = '';
  [['filter','依篩選出題'], ['custom','自選題目測驗']].forEach(([key,label]) => {
    const c = document.createElement('button');
    c.className = 'chip' + (state.orderMode === key ? ' active' : '');
    c.textContent = label;
    c.onclick = () => {
      if(state.orderMode === key) return;
      state.orderMode = key;
      if(key === 'custom'){ state.customLocked = false; }
      refreshAll();
    };
    orderChips.appendChild(c);
  });

  const themeList = document.getElementById('themeList');
  themeList.innerHTML = '';
  const counts = {};
  QUIZ_DATA.forEach(it => counts[it.theme] = (counts[it.theme]||0)+1);

  const allTab = document.createElement('li');
  allTab.className = 'folder-tab' + (state.themes.size === THEMES.length ? ' active' : '');
  allTab.innerHTML = '<span>全部主題</span><span class="cnt">'+QUIZ_DATA.length+'</span>';
  allTab.onclick = () => { state.themes = new Set(THEMES); refreshAll(); };
  themeList.appendChild(allTab);

  THEMES.forEach(t => {
    const li = document.createElement('li');
    const active = state.themes.size !== THEMES.length && state.themes.has(t);
    li.className = 'folder-tab' + (active ? ' active' : '');
    li.innerHTML = '<span>'+shortTheme(t)+'</span><span class="cnt">'+(counts[t]||0)+'</span>';
    li.onclick = () => {
      if(state.themes.size === THEMES.length){ state.themes = new Set([t]); }
      else if(state.themes.has(t) && state.themes.size === 1){ state.themes = new Set(THEMES); }
      else { state.themes = new Set([t]); }
      refreshAll();
    };
    themeList.appendChild(li);
  });

  const chipRow = document.getElementById('qtypeChips');
  chipRow.innerHTML = '';
  QTYPES_ORDER.forEach(qt => {
    const c = document.createElement('button');
    c.className = 'chip' + (state.qtypes.has(qt) ? ' active' : '');
    c.textContent = qt;
    c.onclick = () => {
      if(state.qtypes.has(qt)){
        if(state.qtypes.size > 1) state.qtypes.delete(qt);
      } else { state.qtypes.add(qt); }
      refreshAll();
    };
    chipRow.appendChild(c);
  });

  updateSearchVisibility();
}

function updateSearchVisibility(){
  const show = state.mode === 'browse' || (state.mode === 'quiz' && state.orderMode === 'custom' && !state.customLocked);
  document.getElementById('searchWrap').style.display = show ? 'block' : 'none';
}

function renderStats(){
  document.getElementById('statTotal').textContent = QUIZ_DATA.length;
}

function rebuildOrder(){
  let items = filteredItems();
  state.order = items.map(it => it.id);
  state.pos = 0;
  state.revealed = false;
  userAnswers = {};
}

function lockCustomQuiz(){
  if(state.customSelected.size === 0) return;
  let ids = Array.from(state.customSelected);
  ids.sort((a,b) => parseInt(a,10) - parseInt(b,10));
  state.order = ids;
  state.pos = 0;
  state.revealed = false;
  userAnswers = {};
  state.customLocked = true;
}

function renderQuizPanel(){
  const panel = document.getElementById('panel');
  const total = state.order.length;

  if(total === 0){
    panel.innerHTML = '<div class="empty">目前篩選條件下沒有符合的題目，換個主題試試。</div>';
    return;
  }
  if(state.pos >= total) state.pos = 0;

  const id = state.order[state.pos];
  const it = QUIZ_DATA.find(x => x.id === id);

  let html = '';
  if(state.orderMode === 'custom'){
    html += '<div class="custom-banner">📋 自選題目測驗（共 '+total+' 題）<button class="edit-again-btn" id="editSelectionBtn">重新挑選題目</button></div>';
  }
  html += '<div class="progress-wrap"><span>'+(state.pos+1)+' / '+total+'</span>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+((state.pos)/Math.max(total-1,1)*100)+'%"></div></div></div>';

  html += '<div class="card">';
  html += '<div class="card-meta">';
  html += '<span class="tag theme">'+shortTheme(it.theme)+'</span>';
  html += '<span class="tag qtype">'+it.qtype+'</span>';
  if(it.marker){ html += '<span class="tag marker">'+escapeHtml(it.marker)+'</span>'; }
  html += '<span class="qnum">題號 #'+(parseInt(id)+1)+'</span>';
  html += '</div>';

  html += '<div class="question-text">'+escapeHtml(it.question)+'</div>';

  const draft = userAnswers[id] || '';

  html += '<div class="write-area"><textarea id="userAnswerInput" placeholder="在這裡打出你自己的答案，寫完後按下方按鈕對照標準答案…">'+escapeHtml(draft)+'</textarea></div>';
  html += '<div class="write-hint">作答內容只會暫存在目前這一題，切換到下一題就會自動清空。</div>';

  if(!state.revealed){
    html += '<button class="reveal-btn" id="compareBtn">對照標準答案</button>';
  } else {
    html += '<div class="diff-legend">差異標記：<mark class="diff-bad">紅字粗體</mark> 表示你的作答與標準答案不同或遺漏的部分，會隨你修改內容即時更新</div>';
    html += '<div class="compare-grid">';
    html += '<div class="compare-col"><div class="answer-label">你的作答</div>';
    html += '<div id="userDiffView">'+renderUserDiffHtml(it.answer, draft)+'</div>';
    html += '</div>';
    html += '<div class="compare-col"><div class="answer-label">題庫標準答案</div><ul class="answer-list" id="stdDiffView">'+renderStdListDiff(it.answer, draft)+'</ul></div>';
    html += '</div>';
    html += '<div class="action-row">';
    html += '<button class="act-btn next" id="btnNext">下一題 →</button>';
    html += '</div>';
  }
  html += '</div>';

  panel.innerHTML = html;

  const ta = document.getElementById('userAnswerInput');
  if(ta){
    ta.addEventListener('input', (e) => {
      userAnswers[id] = e.target.value;
      if(state.revealed){
        clearTimeout(diffTimer);
        diffTimer = setTimeout(() => updateQuizDiff(id, it), 200);
      }
    });
  }
  const cb = document.getElementById('compareBtn');
  if(cb) cb.onclick = () => {
    const el = document.getElementById('userAnswerInput');
    userAnswers[id] = el ? el.value : (userAnswers[id]||'');
    state.revealed = true;
    renderQuizPanel();
  };
  const bn = document.getElementById('btnNext');
  if(bn) bn.onclick = () => {
    delete userAnswers[id];
    state.pos = (state.pos + 1) % total;
    state.revealed = false;
    renderQuizPanel();
  };
  const es = document.getElementById('editSelectionBtn');
  if(es) es.onclick = () => {
    state.customLocked = false;
    renderPickerPanel();
  };
}

function renderPickerPanel(){
  const panel = document.getElementById('panel');
  const candidates = filteredItems();
  const selCount = state.customSelected.size;

  let html = '';
  html += '<div class="picker-toolbar">';
  html += '<div class="picker-count">已選 <strong>'+selCount+'</strong> 題</div>';
  html += '<div class="picker-actions">';
  html += '<button class="chip" id="pickAllBtn">全選目前顯示('+candidates.length+')</button>';
  html += '<button class="chip" id="pickClearBtn">清空已選</button>';
  html += '</div></div>';

  if(candidates.length === 0){
    html += '<div class="empty">目前篩選條件下沒有符合的題目可供選擇，換個主題試試。</div>';
  } else {
    html += '<div class="picker-list">';
    candidates.forEach(it => {
      const checked = state.customSelected.has(it.id);
      html += '<label class="picker-item'+(checked?' checked':'')+'">';
      html += '<input type="checkbox" data-id="'+it.id+'" '+(checked?'checked':'')+'>';
      html += '<span class="picker-item-body">';
      html += '<span class="card-meta" style="margin-bottom:0;">';
      html += '<span class="tag theme">'+shortTheme(it.theme)+'</span>';
      html += '<span class="tag qtype">'+it.qtype+'</span>';
      if(it.marker){ html += '<span class="tag marker">'+escapeHtml(it.marker)+'</span>'; }
      html += '<span class="qnum">#'+(parseInt(it.id)+1)+'</span>';
      html += '</span>';
      html += '<span class="picker-item-q">'+escapeHtml(it.question)+'</span>';
      html += '</span>';
      html += '</label>';
    });
    html += '</div>';
  }

  html += '<div class="picker-footer">';
  html += '<button class="act-btn next" id="startCustomBtn" '+(selCount===0?'disabled':'')+'>開始測驗（已選 '+selCount+' 題）→</button>';
  html += '</div>';

  panel.innerHTML = html;

  panel.querySelectorAll('.picker-item input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      if(e.target.checked) state.customSelected.add(id); else state.customSelected.delete(id);
      e.target.closest('.picker-item').classList.toggle('checked', e.target.checked);
      const cnt = state.customSelected.size;
      const countStrong = panel.querySelector('.picker-count strong');
      if(countStrong) countStrong.textContent = cnt;
      const startBtn = document.getElementById('startCustomBtn');
      if(startBtn){
        startBtn.disabled = cnt === 0;
        startBtn.textContent = '開始測驗（已選 '+cnt+' 題）→';
      }
    });
  });

  const pickAllBtn = document.getElementById('pickAllBtn');
  if(pickAllBtn) pickAllBtn.onclick = () => {
    candidates.forEach(it => state.customSelected.add(it.id));
    renderPickerPanel();
  };
  const pickClearBtn = document.getElementById('pickClearBtn');
  if(pickClearBtn) pickClearBtn.onclick = () => {
    state.customSelected.clear();
    renderPickerPanel();
  };
  const startBtn = document.getElementById('startCustomBtn');
  if(startBtn) startBtn.onclick = () => {
    if(state.customSelected.size === 0) return;
    lockCustomQuiz();
    renderQuizPanel();
  };
}

function renderBrowsePanel(){
  const panel = document.getElementById('panel');
  const items = filteredItems();
  if(items.length === 0){
    panel.innerHTML = '<div class="empty">找不到符合的題目，換個關鍵字或篩選條件試試。</div>';
    return;
  }
  panel.innerHTML = items.map(it => {
    return '<div class="browse-item" data-id="'+it.id+'">'
      + '<div class="card-meta">'
      + '<span class="tag theme">'+shortTheme(it.theme)+'</span>'
      + '<span class="tag qtype">'+it.qtype+'</span>'
      + (it.marker ? '<span class="tag marker">'+escapeHtml(it.marker)+'</span>' : '')
      + '<span class="qnum">#'+(parseInt(it.id)+1)+'</span>'
      + '</div>'
      + '<div class="question-text">'+escapeHtml(it.question)+'</div>'
      + '<div class="browse-hint">點擊展開／收合答案</div>'
      + '<div class="answer-block"><div class="answer-label">標準答案</div>'+renderAnswerList(it.answer)+'</div>'
      + '</div>';
  }).join('');

  panel.querySelectorAll('.browse-item').forEach(el => {
    el.addEventListener('click', (e) => {
      el.classList.toggle('open');
    });
  });
}

function refreshAll(){
  buildSidebar();
  if(state.mode === 'quiz'){
    if(state.orderMode === 'custom'){
      if(state.customLocked){ renderQuizPanel(); }
      else { renderPickerPanel(); }
    } else {
      rebuildOrder();
      renderQuizPanel();
    }
  } else {
    renderBrowsePanel();
  }
  renderStats();
}

document.getElementById('btnQuizMode').onclick = () => {
  state.mode = 'quiz';
  document.getElementById('btnQuizMode').classList.add('active');
  document.getElementById('btnBrowseMode').classList.remove('active');
  refreshAll();
};
document.getElementById('btnBrowseMode').onclick = () => {
  state.mode = 'browse';
  document.getElementById('btnBrowseMode').classList.add('active');
  document.getElementById('btnQuizMode').classList.remove('active');
  refreshAll();
};

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value.trim();
  if(state.mode === 'browse'){ renderBrowsePanel(); }
  else if(state.orderMode === 'custom' && !state.customLocked){ renderPickerPanel(); }
});

refreshAll();
</script>
</body>
</html>
